# config/stgat.yaml
datasource: synthetic

synthetic:
  feature_names: ['queue_length', 'utilization', 'arrival_rate', 'avg_delay']
  horizon: 12
  num_nodes: 5
  num_features: 4
  hidden_channels: 64
  num_layers: 1
  dropout_tem: 0.0
  num_heads_tem: 4
  num_heads_spa: 4
  dropout_spa: 0.0
  dropout_mlp: 0.1
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 50


abilene:
  feature_names: ['in_flow', 'out_flow']
  horizon: 12
  num_nodes: 12
  num_features: 2
  batch_size: 64
  hidden_channels: 64
  num_layers: 1
  dropout_tem: 0.0
  num_heads_tem: 4
  num_heads_spa: 4
  dropout_spa: 0.0
  dropout_mlp: 0.1
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 50

